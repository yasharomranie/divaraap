name: Publish installation support tools
on:
  push:
    branches: [main]
    paths:
      - distribution/installer-diagnostics.php
      - config/database.php
      - scripts/build-deployment-repair.py
      - distribution/deployment-repair.template.php
      - distribution/deployment-runner.php
      - app/Support/Deployment/DeploymentManager.php
      - Modules/Admin/Filament/Pages/ManageDeployment.php
      - resources/views/filament/manage-deployment.blade.php
      - public/assets/deployment.js
      - app/Support/Deployment/GitHubRelease.php
      - .github/workflows/support-tools.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: installation-support-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build-deployment-repair.py --output "$RUNNER_TEMP/deployment-repair"
          cp distribution/installer-diagnostics.php "$RUNNER_TEMP/installer-diagnostics-v2.php"
          gh release upload deploy-main distribution/installer-diagnostics.php "$RUNNER_TEMP/installer-diagnostics-v2.php" config/database.php "$RUNNER_TEMP/deployment-repair/deployment-repair-v1.php" "$RUNNER_TEMP/deployment-repair/deployment-repair-v2.php" "$RUNNER_TEMP/deployment-repair/deployment-repair-v3.php" "$RUNNER_TEMP/deployment-repair/deployment-repair-v4.php" "$RUNNER_TEMP/deployment-repair/deployment-repair-v5.php" "$RUNNER_TEMP/deployment-repair/deployment-repair-v6.php" --clobber
